name: Deploy Hackverge site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine base path
        id: basepath
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          # A user/organization root site (e.g. "yourname.github.io") and any repo
          # with a CNAME file (custom domain) are served at "/" — no prefix needed.
          # A normal project repo (e.g. "hackverge") is served at "/hackverge/".
          if [[ "$REPO_NAME" == *.github.io ]] || [ -f "CNAME" ] || [ -f "dist/CNAME" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        run: node build/build.mjs
        env:
          BASE_PATH: ${{ steps.basepath.outputs.base }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
