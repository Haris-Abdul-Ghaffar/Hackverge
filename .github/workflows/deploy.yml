name: Deploy Hackverge site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine base path and site URL
        id: basepath
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ -f "CNAME" ]; then
            DOMAIN=$(tr -d '[:space:]' < CNAME)
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "url=https://$DOMAIN" >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_NAME" == *.github.io ]]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "url=https://$REPO_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO_NAME" >> "$GITHUB_OUTPUT"
            echo "url=https://$OWNER.github.io/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        run: node build/build.mjs
        env:
          BASE_PATH: ${{ steps.basepath.outputs.base }}
          SITE_URL: ${{ steps.basepath.outputs.url }}

      - name: Carry custom domain into build output
        run: |
          if [ -f "CNAME" ]; then
            cp CNAME dist/CNAME
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
